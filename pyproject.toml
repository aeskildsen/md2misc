[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "md2misc"
version = "0.1.0"
description = "A command line tool and Python module that converts Markdown to TeX and to SuperCollider help (schelp)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Kervegan" },
    { name = "Anders Eskildsen" },
]
requires-python = ">=3.10"
dependencies = ["click>=8.2"]

[project.optional-dependencies]
# the test suite. the SCDoc tests also need sclang (SuperCollider); they are skipped without it
test = ["pytest"]
# `tests/battery.py build`, which makes the TeX fixtures again
battery = ["pyyaml", "pathvalidate"]

[project.urls]
Homepage = "https://github.com/aeskildsen/md2misc"
"Derived from" = "https://github.com/paulhectork/md2tex"

[project.scripts]
md2misc = "md2misc.cli:main"

[tool.setuptools]
packages = ["md2misc", "md2misc.backends"]

[tool.setuptools.package-data]
md2misc = ["templates/*.tex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the checkout, for md2misc; the tests folder, for the helper modules of the tests
pythonpath = [".", "tests"]
